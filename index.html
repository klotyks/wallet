<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
  </head>
  <body onload="onLoadApp()" class="bg-secondary">
    <div class="container p-3 mb-2 bg-dark text-white rounded">
      <div class="container px-4">
        <div class="row gx-5">
          <div class="col text-left">
            <div class="p-3"><h1>Wallet</h1></div>
          </div>
          <div class="col text-center">
            <div class="p-3">
              <h1>Ballance $<span id="span-balance"></span></h1>
            </div>
          </div>
        </div>
      </div>
      <div class="container-fluid rounded">
        <div class="container overflow-hidden text-center">
          <div class="row gx-5">
            <div class="col bg-dark bg-gradient border border-dark rounded">
              <div class="p-3">
                <div><h2>Income</h2></div>
                <div class="input-group-sm mb-3">
                  <select id="inputGroupSelect01" class="form-select">
                    <option selected>Choose income category</option>
                  </select>
                  <div class="input-group input-group-sm mb-3">
                    <span class="input-group-text" id="inputGroup-sizing-sm"
                      >Enter amount:</span
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="income-input"
                      aria-label="Sizing example input"
                      aria-describedby="inputGroup-sizing-sm"
                    />
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="button-income"
                    >
                      Confirm
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="col bg-dark bg-gradient border border-dark rounded">
              <div class="p-3">
                <div><h2>Expense</h2></div>
                <div class="input-group-sm mb-3">
                  <select id="inputGroupSelect02" class="form-select">
                    <option selected>Choose expense category</option>
                  </select>
                  <div class="input-group input-group-sm mb-3">
                    <span class="input-group-text" id="inputGroup-sizing-sm"
                      >Enter amount:</span
                    >
                    <input
                      type="text"
                      id="expense-input"
                      id="elInputOutcome"
                      class="form-control"
                      aria-label="Sizing example input"
                      aria-describedby="inputGroup-sizing-sm"
                    />
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="button-expense"
                      id="elInputOutcome"
                    >
                      Confirm
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="container">
        <div class="wrap-h">
          <h1>History</h1>
        </div>
        <div class="list">
          <ol class="list-group list-group-numbered" id="ol-history">
            <!-- <li class="list-group-item">A list item</li>
            <li class="list-group-item">A list item</li>
            <li class="list-group-item">A list item</li> -->
          </ol>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>

    <script src="/js/model.js"></script>
    <script src="/js/controller.js"></script>
    <script src="/js/view/generate.js"></script>
    <script src="/js/view/render.js"></script>
    <script src="/js/view/on.js"></script>
  </body>
</html>
